name: iosApp
options:
  bundleIdPrefix: com.circuitflip.flipledger
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.circuitflip.flipledger
        INFOPLIST_FILE: iosApp/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        # Required so Xcode 15+ allows the Gradle run-script to write build outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Where the Gradle-built ComposeApp.framework is placed by embedAndSign.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
    preBuildScripts:
      - name: "Compile Kotlin Framework"
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED"
            exit 0
          fi

          java_major_version() {
            java_version=$("$1/bin/java" -version 2>&1 | awk -F '"' '/version/ { print $2; exit }')
            case "$java_version" in
              1.*) echo "$java_version" | cut -d. -f2 ;;
              *) echo "$java_version" | cut -d. -f1 ;;
            esac
          }

          java_major=0
          if [ -x "${JAVA_HOME:-}/bin/java" ]; then
            java_major=$(java_major_version "$JAVA_HOME")
          fi
          case "$java_major" in
            ''|*[!0-9]*) java_major=0 ;;
          esac

          if [ "$java_major" -lt 17 ]; then
            for java_home_candidate in \
              "/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" \
              "/usr/local/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"; do
              if [ -x "$java_home_candidate/bin/java" ]; then
                JAVA_HOME="$java_home_candidate"
                java_major=$(java_major_version "$JAVA_HOME")
                break
              fi
            done
          fi

          if [ "$java_major" -lt 17 ]; then
            echo "error: Flip Ledger requires JDK 17 or newer. Install OpenJDK 17 and rebuild."
            exit 1
          fi

          export JAVA_HOME
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    archive:
      config: Debug
